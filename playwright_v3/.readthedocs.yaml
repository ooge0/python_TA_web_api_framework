version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz       # required by sphinx.ext.graphviz and sphinx.ext.inheritance_diagram

python:
  install:
    - requirements: playwright_v3/requirements.txt
    - method: pip
      packages:
        - playwright        # Python package only (no browser binaries needed for docs build)
        - pytest-playwright # required so autoapi can import the test modules without errors

sphinx:
  configuration: playwright_v3/docs/source/conf.py
  # -W is intentionally omitted: RTD treats warnings as errors only when you pass -W,
  # and some autoapi/inheritance-diagram warnings are expected and suppressed in conf.py.
