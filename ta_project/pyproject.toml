[tool.pytest.ini_options]
# Root pytest configuration. Replaces config/pytest.ini, which lived outside the
# rootdir (so `pytest` never auto-loaded it) and carried another project's
# absolute `pythonpath`.
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --junitxml=resources/test_report/junit.xml"
filterwarnings = [
    "ignore::UserWarning",
]
markers = [
    "api: back-end / front-end API tests",
    "ui: Selenium UI tests",
    "smoke: minimal fast subset",
    "regression: full regression subset",
    "req(*ids): the REQ-* requirements this test verifies - checked against docs/source/qa/feature_catalogue.rst by utilities/_devtools/check_traceability.py",
    "tc(*ids): the TC-* test case IDs this test implements - used by utilities/_devtools/generate_test_results_rst.py to join JUnit XML results with test case specifications",
]

# Parallel runs: `pytest-xdist` is installed. Run the suite across CPUs with
#   pytest -n auto --dist loadgroup
# and force a single process for debugging with
#   pytest -n0
# The API tests are parallel-safe (each write test creates and cleans up its own
# record). The UI tests are auto-tagged `xdist_group("ui")` so they all land on
# one worker under `--dist loadgroup`, avoiding the admin-session race (KI-11).
# CI runs `-m "not ui"` for the API job and `-m ui -n0` for the UI job.


[tool.coverage.run]
source = ["core", "utilities"]
branch = true
omit = [
    "*/_devtools/*",   # developer-only doc scripts, not test targets
    "*/__init__.py",
]

[tool.coverage.report]
# Floor for the CI run (`-m "not ui"`, so page objects are only partly hit).
# Raise this as coverage rises - see known_issues KI-14.
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
