[tox]
envlist = py312, lint
skip_missing_interpreters = true

[testenv]
deps = -rrequirements.txt
passenv = *

[testenv:py312]
description = run the API test suite in parallel (no browser required)
commands =
    pytest -m "not ui" -n auto {posargs}

[testenv:test]
description = run the full suite - API parallel, UI sequential on the configured browser
setenv =
    ALLURE_RESULTS_DIR = {toxinidir}/resources/test_report/allure_results
    # Playwright installs browsers into a cache dir; CI can pre-warm it.
    PLAYWRIGHT_BROWSERS_PATH = {toxinidir}/.playwright
commands =
    playwright install {env:PW_BROWSER:firefox} --with-deps
    pytest -m "not ui" -n auto --alluredir={env:ALLURE_RESULTS_DIR} {posargs}
    pytest -m ui -n0 --browser {env:PW_BROWSER:firefox} --alluredir={env:ALLURE_RESULTS_DIR} {posargs}
    python -m utilities._devtools.generate_test_results_rst

[testenv:lint]
deps = ruff
commands =
    ruff check core utilities tests

[testenv:make_pdf_docs]
commands = invoke build-pdf

[testenv:make_html_docs]
commands = invoke build-html
