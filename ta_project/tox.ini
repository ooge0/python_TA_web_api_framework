[tox]
envlist = py312, lint
skip_missing_interpreters = true

[testenv]
deps = -rrequirements.txt
passenv = *

[testenv:py312]
description = run the test suite in parallel
commands =
    pytest -n auto {posargs}

[testenv:test]
description = run the suite and write an Allure result dir (does not open a browser)
setenv =
    ALLURE_RESULTS_DIR = {toxinidir}/resources/test_report/allure_reports
commands =
    pytest -n auto --alluredir={env:ALLURE_RESULTS_DIR} {posargs}

[testenv:lint]
deps = pylint
commands =
    pylint core utilities tests --rcfile=config/pylint.rc

[testenv:make_pdf_docs]
commands = invoke build-pdf

[testenv:make_html_docs]
commands = invoke build-html
