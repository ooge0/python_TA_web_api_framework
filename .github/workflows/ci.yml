name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playwright_v3/requirements.txt
      - run: pip install -r requirements.txt
      - name: ruff
        run: ruff check core utilities tests

  traceability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playwright_v3/requirements.txt
      - run: pip install -r requirements.txt
      - name: requirements traceability gate
        run: python -m utilities._devtools.check_traceability

  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: playwright_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playwright_v3/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest (API suite, parallel)
        run: >
          pytest -n auto -m "not ui"
          --cov --cov-report=term-missing --cov-report=xml
          --junitxml=junit-api.xml
          --alluredir=allure-results-api
      - name: test report summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API test results
          path: playwright_v3/junit-api.xml
          reporter: java-junit
      - name: upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            playwright_v3/junit-api.xml
            playwright_v3/coverage.xml
      - name: upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: playwright_v3/allure-results-api/

  # UI tests run on a browser matrix: firefox and chromium.
  # Each browser gets its own job with its own JUnit XML artifact so results
  # can be compared per-browser in the Allure report and dorny summary.
  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # run both browsers even if one fails
      matrix:
        browser: [firefox, chromium]
    defaults:
      run:
        working-directory: playwright_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playwright_v3/requirements.txt
      - run: pip install -r requirements.txt
      - name: install playwright browsers
        run: python -m playwright install ${{ matrix.browser }} --with-deps
      - name: pytest (UI suite, ${{ matrix.browser }}, headless)
        run: >
          pytest -m ui -n0
          --browser ${{ matrix.browser }}
          --headed=false
          --junitxml=junit-ui-${{ matrix.browser }}.xml
          --alluredir=allure-results-ui-${{ matrix.browser }}
          --screenshot only-on-failure
          --video retain-on-failure
          --tracing retain-on-failure
        env:
          PWDEBUG: "0"
      - name: test report summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: UI results (${{ matrix.browser }})
          path: playwright_v3/junit-ui-${{ matrix.browser }}.xml
          reporter: java-junit
      - name: upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports-${{ matrix.browser }}
          path: |
            playwright_v3/junit-ui-${{ matrix.browser }}.xml
            playwright_v3/test-results/
      - name: upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: playwright_v3/allure-results-ui-${{ matrix.browser }}/

  docs:
    runs-on: ubuntu-latest
    needs: [test-api, test-ui]
    if: always()
    defaults:
      run:
        working-directory: playwright_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playwright_v3/requirements.txt
      - run: pip install -r requirements.txt
      - name: download junit xml (api)
        uses: actions/download-artifact@v4
        with:
          name: api-test-reports
          path: playwright_v3/resources/test_report/
        continue-on-error: true
      - name: download junit xml (ui firefox)
        uses: actions/download-artifact@v4
        with:
          name: ui-test-reports-firefox
          path: playwright_v3/resources/test_report/
        continue-on-error: true
      - name: download junit xml (ui chromium)
        uses: actions/download-artifact@v4
        with:
          name: ui-test-reports-chromium
          path: playwright_v3/resources/test_report/
        continue-on-error: true
      - name: generate test results rst
        run: python -m utilities._devtools.generate_test_results_rst
        continue-on-error: true
      - name: sphinx build
        run: sphinx-build -b html docs/source docs/_build/html -W --keep-going
      - name: upload docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: playwright_v3/docs/_build/html/

  allure-report:
    if: always()
    needs: [test-api, test-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download API allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
        continue-on-error: true
      - name: download UI allure results (firefox)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui-firefox
          path: allure-results/
        continue-on-error: true
      - name: download UI allure results (chromium)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ui-chromium
          path: allure-results/
        continue-on-error: true
      - name: generate allure report
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_history: allure-history
      - name: upload allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-history/
