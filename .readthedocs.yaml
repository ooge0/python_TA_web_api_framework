# Root-level config — used ONLY by the ReadTheDocs project whose
# "Configuration file" is left at the default (repo root).
# Both active docs sites use their own subfolder config instead:
#   playwright_v3 site → playwright_v3/.readthedocs.yaml
#   selenium_v2 site  → selenium_v2/.readthedocs.yaml
#
# This file is kept so RTD does not reject the repo on import.
# Point any new RTD project at the appropriate subfolder config above.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - graphviz

python:
  install:
    - requirements: playwright_v3/requirements.txt

sphinx:
  configuration: playwright_v3/docs/source/conf.py
